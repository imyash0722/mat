[package]
name = "mat"
version = "1.1.0"
edition = "2024"
description = "High-performance terminal Markdown preview engine for Neovim and CLI with bat-style framing"
license = "MIT"
repository = "https://github.com/imyash0722/mat"
readme = "README.md"
keywords = ["markdown", "neovim", "neovim-plugin", "terminal", "preview"]
categories = ["command-line-utilities"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
terminal_size = "0.4"
unicode-width = "0.2"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
crossterm = "0.29"

[profile.release]
opt-level = 3
strip = true
