[package]
name = "mdview"
version = "1.1.0"
edition = "2024"
description = "Vibrant, high-fidelity CLI Markdown reader with bat-style framing and syntax highlighting"
license = "MIT"
repository = "https://github.com/imyash0722/mdview"
readme = "README.md"
keywords = ["markdown", "cli", "terminal", "reader", "viewer"]
categories = ["command-line-utilities"]

[dependencies]
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }
terminal_size = "0.4"
unicode-width = "0.2"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }

[profile.release]
opt-level = 3
strip = true
