name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_ext: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive_ext: tar.gz
            use_musl: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            archive_ext: tar.gz
            cross_aarch64: true
          - os: macos-13
            target: x86_64-apple-darwin
            archive_ext: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_ext: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_ext: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Cross-Compilation Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          if [ "${{ matrix.use_musl }}" = "true" ]; then
            sudo apt-get install -y musl-tools
          fi
          if [ "${{ matrix.cross_aarch64 }}" = "true" ]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.cross_aarch64 }}" = "true" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target ${{ matrix.target }}

      - name: Package Archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_NAME="mdview-${VERSION}-${{ matrix.target }}"
          STAGING_DIR="/tmp/${PKG_NAME}"
          mkdir -p "${STAGING_DIR}/completions"

          cp "target/${{ matrix.target }}/release/mdview" "${STAGING_DIR}/"
          cp README.md LICENSE "${STAGING_DIR}/"
          cp -r completions/* "${STAGING_DIR}/completions/"

          tar -czf "${PKG_NAME}.tar.gz" -C /tmp "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Package Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_NAME="mdview-${VERSION}-${{ matrix.target }}"
          STAGING_DIR="staging/${PKG_NAME}"
          mkdir -p "${STAGING_DIR}/completions"

          cp "target/${{ matrix.target }}/release/mdview.exe" "${STAGING_DIR}/"
          cp README.md LICENSE "${STAGING_DIR}/"
          cp -r completions/* "${STAGING_DIR}/completions/"

          7z a "${PKG_NAME}.zip" "./${STAGING_DIR}/*"
          sha256sum "${PKG_NAME}.zip" > "${PKG_NAME}.zip.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: |
            mdview-*.tar.gz
            mdview-*.tar.gz.sha256
            mdview-*.zip
            mdview-*.zip.sha256

  publish-release:
    name: Publish GitHub Release
    needs: [build-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Unified Checksum File
        shell: bash
        run: |
          cd release-artifacts
          cat *.sha256 > SHA256SUMS.txt
          rm -f *.sha256
          ls -lh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
